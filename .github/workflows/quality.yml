name: Calidad

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Formato, código, pruebas y builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar formato
        run: npm run format

      - name: Ejecutar lint
        run: npm run lint

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Ejecutar pruebas
        run: npm test

      - name: Compilar web y Apps Script
        run: npm run build

      - name: Auditar dependencias
        run: npm audit --audit-level=moderate
